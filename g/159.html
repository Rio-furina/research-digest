<h1 class="page-title">プライマリーバランス(基礎的財政収支)とは？</h1>
<p>別名：PB, 基礎的財政収支</p>
<h3>意味</h3>
<p>国債の利払いなどを除いた、その年の税収等と政策的な支出のバランス。</p>
<h3>例・ヒント</h3>
<p>例：黒字なら借金に頼らず政策経費を賄えている状態。利払い費は含まれず債務は増えうる。</p>
