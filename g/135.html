<h1 class="page-title">コアコアCPIとは？</h1>
<p>別名：食料(酒類除く)・エネルギーを除く総合</p>
<h3>意味</h3>
<p>生鮮食品とエネルギーを除いた消費者物価指数。物価の基調的な動きを見るために使う。</p>
<h3>例・ヒント</h3>
<p>例：海外要因による価格変動を除き、賃金や需要に根差した物価上昇かを判断する材料になる。</p>
