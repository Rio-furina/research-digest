<p>別名：PER</p>
<h3>意味</h3>
<p>株価が1株あたり利益の何倍かを示す指標。割安・割高の目安として使われる。</p>
<h3>例・ヒント</h3>
<p>例：業種や成長性で水準は異なるため、低いだけで割安とは言えない。利益が一時的に増減すると数字が歪む。</p>
