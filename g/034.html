<h1 class="page-title">株式公開買付け(TOB)とは？</h1>
<p>別名：TOB, 公開買付け, 公開買付</p>
<h3>意味</h3>
<p>買付価格や期間を公告し、市場外で不特定多数の株主から株式を買い集める手法。</p>
<h3>例・ヒント</h3>
<p>例：TOB価格が市場価格に上乗せ(プレミアム)されるのが通例。応募するかは各株主が判断し、報道だけで成立とは限らない。</p>
