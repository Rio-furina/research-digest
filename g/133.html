<p>別名：恐怖指数</p>
<h3>意味</h3>
<p>米国株の先行きの変動に対する市場の予想を数値化した指数。「恐怖指数」とも呼ばれる。</p>

<p>例：市場の不安が強まると上昇しやすい。数値は将来の変動予想であり、株価の方向を予測するものではない。</p>
