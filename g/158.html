<p>別名：国家債務リスク</p>
<h3>意味</h3>
<p>国が債務を返済できなくなる危険。国債の価格や金利、為替に影響する。</p>
<h3>例・ヒント</h3>
<p>例：財政悪化への懸念で国債の利回りが上がる。自国通貨建ての国債では、外貨建てとは事情が異なる。</p>
