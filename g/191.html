<h1 class="page-title">ボラティリティとは？</h1>
<p>別名：ボラ, 変動率</p>
<h3>意味</h3>
<p>価格の変動の大きさ。値動きが激しいほどボラティリティが高く、不確実性も大きい。</p>
<h3>例・ヒント</h3>
<p>例：「ボラティリティが高い」は上昇か下落かを示さず、振れ幅が大きいという意味。リスクの大きさの目安に使う。</p>
