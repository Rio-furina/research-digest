<h1 class="page-title">名目と実質とは？</h1>
<p>別名：名目GDP, 実質GDP, 名目値, 実質値</p>
<h3>意味</h3>
<p>名目は物価変動を含む額面の値、実質は物価の影響を取り除いた値。</p>
<h3>例・ヒント</h3>
<p>例：名目GDPが増えても物価上昇が主因なら実質は増えていない。ニュースはどちらの話か確認する。</p>
