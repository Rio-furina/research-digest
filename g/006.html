<h1 class="page-title">ROE（自己資本利益率）とは？</h1>
<p>別名：ROE, 自己資本利益率</p>
<h3>意味</h3>
<p>株主の資金（自己資本）でどれだけ利益を上げたかを示す指標。経営効率の目安。</p>
<h3>例・ヒント</h3>
<p>例：借入を増やして自己資本を減らすと、利益が同じでもROEは上がる。数字の背景にある財務の状態も確認する。</p>
