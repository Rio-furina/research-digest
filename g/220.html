<h1 class="page-title">マイナス金利政策とは？</h1>

<h3>意味</h3>
<p>金融機関が中央銀行に預ける資金の一部に、手数料にあたるマイナスの金利をつける政策。</p>
<h3>例・ヒント</h3>
<p>例：銀行に貸出を促す狙いがある。一方で銀行収益を圧迫するという副作用も指摘される。預金金利が直ちにマイナスになるわけではない。</p>
