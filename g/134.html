<h1 class="page-title">コアCPIとは？</h1>
<p>別名：コア消費者物価, 生鮮食品を除く総合</p>
<h3>意味</h3>
<p>生鮮食品を除いた消費者物価指数。天候で振れやすい生鮮の影響を除き、基調を見る。</p>
<h3>例・ヒント</h3>
<p>例：エネルギー価格は含まれるため、資源高の影響は残る。エネルギーも除く指数と区別して読む。</p>
