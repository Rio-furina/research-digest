<p>別名：第三者調査委員会</p>
<h3>意味</h3>
<p>不祥事などの際、企業から独立した外部の専門家が事実関係や原因を調べる委員会。</p>
<h3>例・ヒント</h3>
<p>例：報告書の信頼性は、委員の独立性と調査範囲で決まる。企業が依頼する形でも、結論の中身を精査して読む。</p>
