<h1 class="page-title">ペイオフとは？</h1>

<h3>意味</h3>
<p>破綻した金融機関の預金者に、預金保険から保険金を直接支払う制度。</p>
<h3>例・ヒント</h3>
<p>例：日本では2005年に全面的に解禁された。保護対象は預金の種類によって異なるため、預入先と商品の確認が必要。</p>
