<h1 class="page-title">マネーストックとは？</h1>

<h3>意味</h3>
<p>企業や家計などが保有する通貨の総量。預金や現金などの合計で、景気や物価の背景を見る。</p>
<h3>例・ヒント</h3>
<p>例：M2やM3などの定義がある。貸出が増えると預金が生まれて増えるため、中央銀行の供給量だけで決まらない。</p>
