<h1 class="page-title">時価総額とは？</h1>

<h3>意味</h3>
<p>株価に発行済株式数を掛けた値。市場が評価する企業の価値の大きさを表す。</p>
<h3>例・ヒント</h3>
<p>例：株価が高くても株式数が少なければ時価総額は小さい。企業規模の比較には株価でなく時価総額を使う。</p>
