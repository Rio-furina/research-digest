<h1 class="page-title">預金保険制度とは？</h1>
<p>別名：預金保険</p>
<h3>意味</h3>
<p>金融機関が破綻した時に、預金者の預金を一定額まで保護する公的な仕組み。</p>
<h3>例・ヒント</h3>
<p>例：日本では1つの金融機関につき元本1,000万円とその利息までが保護の対象。決済用預金は全額が保護される。</p>
