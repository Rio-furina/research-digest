<h1 class="page-title">IPO(新規株式公開)とは？</h1>
<p>別名：IPO, 新規公開株, 新規上場</p>
<h3>意味</h3>
<p>未上場企業が株式を証券取引所に上場し、広く一般の投資家が売買できるようにすること。</p>
<h3>例・ヒント</h3>
<p>例：初値が公開価格を上回るとは限らない。資金調達の目的と使途、既存株主の売出しの有無が注目点。</p>
